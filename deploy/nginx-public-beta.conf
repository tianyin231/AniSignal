# 安装到 /etc/nginx/sites-enabled/anisignal.conf；沿用现有证书与上游代理片段。
limit_req_zone $binary_remote_addr zone=anisignal_code_ip:1m rate=2r/m;
limit_req_zone $server_name zone=anisignal_code_global:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=anisignal_login_ip:1m rate=10r/m;
limit_req_zone $server_name zone=anisignal_login_global:1m rate=60r/m;

gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/rss+xml image/svg+xml;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name anisignal.xyz www.anisignal.xyz anisignal.nanamiyako.cn 176.34.52.127;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 308 https://anisignal.xyz$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.anisignal.xyz;
    include snippets/anisignal-ssl.conf;
    return 308 https://anisignal.xyz$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name anisignal.xyz;
    include snippets/anisignal-ssl.conf;
    client_max_body_size 20m;
    add_header X-AniSignal-Origin ty always;
    add_header Strict-Transport-Security "max-age=86400" always;
    limit_req_status 429;
    error_page 429 = @auth_rate_limited;

    location ~ ^/api/auth/(register|resend|password/forgot)/?$ {
        limit_req zone=anisignal_code_ip burst=2 nodelay;
        limit_req zone=anisignal_code_global burst=5 nodelay;
        include snippets/anisignal-proxy.conf;
    }
    location ~ ^/api/auth/(login|verify|password/(reset|change))/?$ {
        limit_req zone=anisignal_login_ip burst=5 nodelay;
        limit_req zone=anisignal_login_global burst=10 nodelay;
        include snippets/anisignal-proxy.conf;
    }
    location @auth_rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        add_header Strict-Transport-Security "max-age=86400" always;
        return 429 '{"detail":"请求过于频繁，请稍后重试"}';
    }
    location / { include snippets/anisignal-proxy.conf; }
}
