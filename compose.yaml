# AniSignal 全栈：5 容器单职责形态（共用官方多架构预构建镜像 ghcr.io/tianyin231/anisignal）
#   mysql / redis：持久化数据默认落在 ./data（可通过 DATA_DIR 调整）
#   api：数据库自动迁移 + FastAPI 单进程（仅内部网络暴露 :8000）
#   web：Nuxt 4 Nitro SSR 单进程（运行时反代 http://api:8000，默认仅监听宿主机 127.0.0.1:8090）
#   collector：调度器 + 采集 worker；水平扩容可执行 --scale collector=N
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置随机数据库密码}
      MYSQL_DATABASE: anisignal
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ${DATA_DIR:-./data}/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -uroot --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ${ANISIGNAL_IMAGE:-ghcr.io/tianyin231/anisignal:latest}
    build: .
    init: true
    restart: unless-stopped
    logging: &bounded_logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["bash", "/app/deploy/start-api.sh"]
    env_file: &app_env_file
      - path: .env
        required: false
    environment: &app_env
      ANISIGNAL_DATABASE_URL: mysql+asyncmy://root@mysql:3306/anisignal
      ANISIGNAL_DATABASE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置随机数据库密码}
      ANISIGNAL_REDIS_URL: redis://redis:6379/0
      ANISIGNAL_ADMIN_TOKEN: ${ANISIGNAL_ADMIN_TOKEN:?请在 .env 中设置随机管理员令牌}
      ANISIGNAL_PUBLIC_BASE_URL: ${ANISIGNAL_PUBLIC_BASE_URL:-}
      ANISIGNAL_NEWS_UNIFIED_ENABLED: ${ANISIGNAL_NEWS_UNIFIED_ENABLED:-true}
      ANISIGNAL_YOUTUBE_API_KEY: ${ANISIGNAL_YOUTUBE_API_KEY:-}
      ANISIGNAL_EGRESS_ALLOW_CIDRS: ${ANISIGNAL_EGRESS_ALLOW_CIDRS:-}
      ANISIGNAL_BILI_COOKIE_FILE: /run/anisignal/bilibili/cookies.txt
      TZ: Asia/Shanghai
    volumes: &bili_session
      - ${DATA_DIR:-./data}/bilibili:/run/anisignal/bilibili:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  web:
    image: ${ANISIGNAL_IMAGE:-ghcr.io/tianyin231/anisignal:latest}
    init: true
    restart: unless-stopped
    logging: *bounded_logs
    command: ["node", "/app/web/server/index.mjs"]
    env_file: *app_env_file
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      NUXT_API_SSR_BASE: http://api:8000
      NUXT_PUBLIC_SITE_URL: ${ANISIGNAL_PUBLIC_BASE_URL:-}
      TZ: Asia/Shanghai
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-127.0.0.1:8090}:3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  collector:
    image: ${ANISIGNAL_IMAGE:-ghcr.io/tianyin231/anisignal:latest}
    init: true
    restart: unless-stopped
    logging: *bounded_logs
    command: ["bash", "/app/deploy/start-collector.sh"]
    env_file: *app_env_file
    environment: *app_env
    volumes: *bili_session
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "arq", "app.worker.settings.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
