      # 剩下的靠 child_templates 按出现顺序编号——block 列就是层号。
      # 注意"目标"那组用的是中文数字（第一间目标/第二间目标/第三间目标），
      # 和 第1间怪物等级 的阿拉伯数字不是一个编号体系，正则得两边都收。
      child_templates:
        - template: [讨伐列表, 讨伐列表1]
          occurrence: true
