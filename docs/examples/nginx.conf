# AniSignal 反向代理参考配置（放入 /etc/nginx/conf.d/anisignal.conf）
# 使用前请将 signal.example.com 与证书路径替换为你的实际域名与证书文件。

limit_req_zone $binary_remote_addr zone=anisignal_code_ip:1m rate=2r/m;
limit_req_zone $server_name zone=anisignal_code_global:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=anisignal_login_ip:1m rate=10r/m;
limit_req_zone $server_name zone=anisignal_login_global:1m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name signal.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name signal.example.com;

    ssl_certificate     /etc/letsencrypt/live/signal.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signal.example.com/privkey.pem;

    client_max_body_size 20m;
    add_header Strict-Transport-Security "max-age=86400" always;
    limit_req_status 429;
    error_page 429 = @auth_rate_limited;

    # 内部接口永不对外开放
    location ^~ /api/internal/ {
        return 404;
    }

    location ~ ^/api/auth/(register|resend|password/forgot)/?$ {
        limit_req zone=anisignal_code_ip burst=2 nodelay;
        limit_req zone=anisignal_code_global burst=5 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ~ ^/api/auth/(login|verify|password/(reset|change))/?$ {
        limit_req zone=anisignal_login_ip burst=5 nodelay;
        limit_req zone=anisignal_login_global burst=10 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location @auth_rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        add_header Strict-Transport-Security "max-age=86400" always;
        return 429 '{"detail":"请求过于频繁，请稍后重试"}';
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
