name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests and MySQL migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: anisignal_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # 与生产镜像保持一致
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --frozen
      - name: Verify empty MySQL 8.4 baseline migration and schema parity
        env:
          ANISIGNAL_DATABASE_URL: mysql+asyncmy://root:root@127.0.0.1:3306/anisignal_ci
        run: |
          uv run --frozen alembic upgrade head
          uv run --frozen alembic check
      - run: uv run --frozen pytest -q

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # 锁文件指向国内镜像，runner 上改走官方源；完整性哈希不变
      - run: npm ci --replace-registry-host=always
      - run: npm test
      - run: npx nuxt build
