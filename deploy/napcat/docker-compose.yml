# NapCat（OneBot 通道）参考编排 — 与 AstrBot 同网以便反向 WS 连接
services:
  napcat:
    image: mlikiowa/napcat-docker:${VERSION:-latest}
    container_name: ${NAPCAT_CONTAINER:-napcat}
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - NAPCAT_UID=${NAPCAT_UID:-0}
      - NAPCAT_GID=${NAPCAT_GID:-0}
    ports:
      - ${HOST_IP:-127.0.0.1}:${WEB_HTTP_PORT:-6099}:6099
      - ${HOST_IP:-127.0.0.1}:${ONEBOT_PORT:-3001}:3001
    volumes:
      - ${APP_PATH:-.}/qq:/app/.config/QQ
      - ${APP_PATH:-.}/napcat:/app/napcat/config
    mem_limit: ${MEMORY_LIMIT:-2g}
    mem_reservation: ${MEMORY_RESERVATION:-512m}
    oom_score_adj: -300
    cpus: ${CPUS:-1.0}
    networks:
      - astrbot

networks:
  astrbot:
    external: true
    name: ${ASTRBOT_NETWORK:-anisignal_astrbot}
