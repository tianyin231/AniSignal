  # ---------------- 通用实体路：36 族的 kind spec ----------------
  # name_fields  卡片标题用哪个字段当实体名（都不命中就用页标题）
  # card_fields  渲染卡片摘要 chunk 的 [标签, 字段名]
  # attr_fields  额外落 entity_attrs 的字段（查表探针直接按 attr 查）
  # child_templates 页内子模板 → 行。columns 是"列名: 字段名"映射，
  #               rows_from 用正则把编号字段拆成多行，{0} 是正则捕获组，
  #               @key 是"值就是这个字段本身"，const 是这一批行的常量列
  # rows_from    （kind 级）把 infobox 自己的编号字段拆行，table 必须自己写
  kinds:
    # ---- 角色：一个页 = 角色 + 属性数据 + 信息 + 故事 + 命之座 + 突破简 + 天赋技能 ----
    character:
      name_fields: [名称]
      card_fields:
        - [称号, 称号]
        - [稀有度, 稀有度]
        - [元素属性, 元素属性]
        - [武器类型, 武器类型]
        - [命之座, 命之座]
        - [所属, 所属]
        - [种族, 种族]
        - [性别, 性别]
        - [限定, 限定]
        - [实装日期, 实装日期]
        - [特殊料理, 特殊料理]
        - [介绍, 介绍]
      attr_fields: [名称, 称号, 全名, 英文名称, 稀有度, 元素属性, 武器类型, 命之座,
                    所属, 出身, 种族, 性别, 介绍, 限定, 实装日期, 实装版本,
                    特殊料理, 祈愿类型, 神之眼描述, 羁绊属性, TAG, 始基力,
                    # 角色新（新版合并模板，30 参）把 角色/信息 的字段并进了 infobox；
                    # 现在 0 篇在用，但换模板那天不用改代码，靠这几个字段兜住
                    生日, 职业, 体型, 昵称/外号, 中文CV, 日文CV, 韩文CV, 英文CV, 归属]
      child_templates:
        # 60 参：等级 20/20+/40/…/90/95/100 × 三维 × 突破前后。按等级归组成行，
        # 不摊平——摊平就是 60 个 "20生命上限=2671" 挤在一行里，没法查。
        - template: 角色/属性数据
          rows_from:
            - pattern: '^(\d+\+?)(生命上限|攻击力|防御力)$'
              table: genshin_character_stats
              columns: {level: '{0}', stat: '{1}', value: '@key'}
        - template: 角色/信息
          table: genshin_character_profile
          columns: {cv_cn: 中文CV, cv_jp: 日文CV, cv_kr: 韩文CV, cv_en: 英文CV,
                    birthday: 生日, body_type: 体型, profession: 职业,
                    nicknames: 昵称/外号, namecard: 名片名称, namecard_desc: 名片描述,
                    costume: 衣装名称, element_attr: 角色属性, personal_quest: 个人任务,
                    banner: 卡池名, faction: 归属}
        - template: 角色/故事
          columns: {detail: 角色详细, eye: 神之眼, eye_condition: 神之眼解锁条件,
                    heart: 神之心, heart_condition: 神之心解锁条件,
                    note_name: 冒险笔记名称, note: 冒险笔记,
                    note_condition: 冒险笔记解锁条件}
          table: genshin_character_story
          rows_from:
            - pattern: '^角色故事(\d+)$'
              table: genshin_character_story_detail
              columns: {index: '{0}', text: '@key', condition: '角色故事{0}解锁条件'}
            - pattern: '^其他故事$'
              table: genshin_character_story_detail
              columns: {index: '0', text: '@key', condition: 其他解锁条件}
        - template: 角色/命之座
          rows_from:
            - pattern: '^命之座(\d+)$'
              table: genshin_character_constellation
              columns: {index: '{0}', name: '@key', effect: '命之座{0}效果'}
        - template: 角色/突破简
          table: genshin_character_ascension
          columns: {local_specialty: 突破特产材料, gem_series: 突破晶石材料序列,
                    boss_material: 突破BOSS材料, common_series: 突破普通材料序列,
                    talent_at_20: 20级新天赋, talent_at_60: 60级新天赋}
        - template: 角色/技能升级材料简
          table: genshin_character_talent_material
          columns: {boss_material: 技能BOSS材料, book_series: 技能天赋材料序列,
                    common_series: 技能普通材料序列}
        - template: 角色/技能升级材料
          rows_from:
            - pattern: '^(\d+)→(\d+)$'
              table: genshin_character_talent_levelup
              columns: {from_level: '{0}', to_level: '{1}', materials: '@key'}
        # 373 参！属性1-16 × LV1-15 + 战技动作1-10 + 动作1-12。一个技能一块，
        # occurrence 按出现顺序编号（普通攻击/战技/爆发…）。
        - template: 天赋技能
          occurrence: true
          table: genshin_character_talent
          columns: {skill_name: 技能名, desc: 描述, energy: 能量产出, stagger: 削韧数据}
          rows_from:
            - pattern: '^属性(\d+)LV(\d+)$'
              table: genshin_character_talent_scaling
              columns: {attr_index: '{0}', level: '{1}', value: '@key'}
            - pattern: '^属性(\d+)$'
              table: genshin_character_talent_attr
              columns: {attr_index: '{0}', name: '@key'}
            - pattern: '^战技动作(\d+)$'
              table: genshin_character_talent_motion
              columns: {index: '{0}', name: '@key', particles: '战技动作{0}微粒数',
                        probability: '战技动作{0}概率比', note: '战技动作{0}说明',
                        cooldown: '战技动作{0}判定冷却'}
            - pattern: '^动作(\d+)$'
              table: genshin_character_talent_action
              columns: {index: '{0}', name: '@key', stagger: '动作{0}削韧数值',
                        impact: '动作{0}冲击强度', hit_type: '动作{0}打击类型',
                        range_type: '动作{0}远近类型'}
        - template: 角色/削韧
          rows_from:
            - pattern: '^削韧参数(\d+)_(\d+)$'
              table: genshin_character_stagger
              columns: {param: '{0}', hit: '{1}', value: '@key'}
        # 纯 #ask 查询渲染器，参数只有 1/2（角色名/任务|活动），交给模板数据补捞
        - template: 人物出场
          table: genshin_character_appearance
          columns: {character: '1', kind: '2'}

    # ---- 武器：47 参，等级网格（20/40/…/90 × 突破前后攻击力 + 副属性）----
    weapon:
      name_fields: [名称]
      card_fields:
        - [类型, 类型]
        - [稀有度, 稀有度]
        - [初始攻击力, 初始攻击力]
        - [初始副属性, 初始副属性]
        - [副属性, 副属性]
        - [技能名称, 技能名称]
        - [获取途径, 获取途径]
        - [实装版本, 实装版本]
        - [是否可锻造获取, 是否可锻造获取]
        - [介绍, 介绍]
      attr_fields: [名称, 类型, 稀有度, 介绍, 技能名称, 技能介绍, 技能解析, 故事,
                    获取途径, 实装版本, 是否可锻造获取, 有无突破状态, 突破普通材料序列,
                    突破武器材料序列, 突破高级材料序列, 精炼材料, 锻造材料1, 锻造材料2,
                    锻造材料3, 角色推荐, TAG]
      rows_from:
        - pattern: '^(\d+)(突破前|突破后)攻击力$'
          table: genshin_weapon_atk
          columns: {level: '{0}', phase: '{1}', value: '@key'}
        - pattern: '^(\d+)级副属性$'
          table: genshin_weapon_substat
          columns: {level: '{0}', value: '@key'}

    # ---- 圣遗物：套装级 9 参 + 五部位各 (名/描述/故事)----
    artifact:
      name_fields: [名称]
      card_fields:
        - [最低稀有度, 最低稀有度]
        - [最高稀有度, 最高稀有度]
        - [两件套效果, 两件套效果]
        - [四件套效果, 四件套效果]
        - [获取途径, 获取途径]
        - [实装版本, 实装版本]
      attr_fields: [名称, 最低稀有度, 最高稀有度, 两件套效果, 四件套效果, 获取途径,
                    获取方式, 实装版本, 角色推荐, 提示, TAG]
      rows_from:
        - pattern: '^(生之花|死之羽|时之沙|空之杯|理之冠|祭祀礼冠)$'
          table: genshin_artifact_piece
          columns: {slot: '@key', desc: '{0}描述', story: '{0}故事'}

    # ---- 敌人：111 参（8 元素×8 段抗性、5 段血量、掉落）----
    enemy:
      name_fields: [怪物名]
      card_fields:
        - [怪物类别, 怪物类别]
        - [怪物类型, 怪物类型]
        - [元素属性, 元素属性]
        - [攻击属性, 攻击属性]
        - [实装版本, 实装版本]
        - [别称, 别称]
        - [出现地点, 出现地点]
        - [刷新时间, 刷新时间]
        - [备注, 备注]
      attr_fields: [怪物名, 名称, 副名称, 别称, 怪物类别, 怪物类型, 怪物分类, 元素属性,
                    自身附着属性, 攻击属性, 实装版本, 出现地点, 刷新时间, 备注, TAG,
                    中文CV, 日文CV, 护盾类型, 抗性备注, 抗性状态, 血量档位, 血量比例总,
                    掉落期望, 掉落期望备注, 重量, 韧性, 盾值, 攻击, 防御]
      rows_from:
        # 火抗/火抗2…火抗8、物抗/物抗2…：8 个状态段（1=常态，2-8=各种附属状态）
        - pattern: '^([火水雷冰岩风草物])抗(\d?)$'
          table: genshin_enemy_resist
          columns: {element: '{0}', segment: '{1}', value: '@key'}
        - pattern: '^抗性状态(\d?)$'
          table: genshin_enemy_resist_state
          columns: {segment: '{0}', value: '@key'}
        - pattern: '^血量(\d)(名字|比例)$'
          table: genshin_enemy_hp_phase
          columns: {phase: '{0}', kind: '{1}', value: '@key'}
      child_templates:
        - template: 怪物技能
          occurrence: true
          table: genshin_enemy_skill
          columns: {name: 技能名, display_name: 显示名称, desc: 技能说明,
                    response: 应对方法}

    # ---- 素材 / 消耗品 ----
    material:
