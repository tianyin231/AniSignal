# ---- 开发工具（tools/audit_pages.py）的"未归类页"拆解规则，按顺序第一个命中生效。
# 纯审计口径，不影响 pipeline。星铁 1597 个 other 页里没有漏网的 infobox 家族，
# 剩下的都是剧情/读物/版本专题/角色子页这类本来就无图鉴模板的正文页。
audit:
  title_rules:
    - {name: 机器数据页, regex: '^Data:'}
    - {name: 沙盒/测试, regex: '沙盒|^测试|^示例'}
    - {name: 版本更新/前瞻, regex: '^\d+\.\d+版本|更新专题|前瞻直播|调整公告|版本一览'}
    - {name: 角色子页-资料, regex: '/资料$'}
    - {name: 角色子页-攻略, regex: '/攻略$'}
    - {name: 角色子页-媒体, regex: '/媒体$'}
    - {name: 角色子页-语音, regex: '/语音$'}
    - {name: 角色子页-其他, regex: '/'}
    - {name: 成就/纪念页, regex: '与你同行的回忆|与你的每一天|成就'}
    - {name: 剧情章节, regex: '•其[一二三四五六七八九十]+$|^「.*-.*」'}
    - {name: 命途/星章, regex: '^「(存护|毁灭|巡猎|同谐|智识|虚无|丰饶|欢愉|记忆|繁育|开拓)[ⅠⅡⅢⅣ]?」'}
    - {name: 图书/读物, regex: '^专有名词|^故事|读后|笔记|日记|手记|列传|志'}
    - {name: 模拟宇宙/差分宇宙, regex: '模拟宇宙|差分宇宙|货币战争|命路歧图|祝福|奇物'}
    - {name: 短信/互动文本, regex: '^短信|互动文本|叙事一览'}
    - {name: 跃迁/抽卡记录, regex: '跃迁|抽卡|概率'}
    - {name: 攻略/养成, regex: '攻略|养成|推荐|解析|测评|对比|开荒|一图流'}
    - {name: 剧情/世界观, regex: '考据|设定|世界观|编年史|年表'}
    - {name: 活动/直播, regex: '活动|庆典|联动|生放送|直播|招募|测试'}
    - {name: 编辑/站务, regex: 'WIKI|编辑|教程|公告|创建新页面|首页|兑换码'}
