# 原神（BWIKI 基岩 wiki）——第三款游戏，验证"一游戏一配置"在中文大 wiki 上零代码成立。
#
# 结构化路全部走 parse.kinds 的通用实体路（entities + entity_attrs + 本文件声明的
# 子表）：角色/武器图鉴/怪物信息栏/素材图鉴/NPC/任务/书籍/卡牌/秘境副本… 44 个页级
# 实体模板 → 36 个 kind，kblib/extractors/azurlane.py 那种专用抽取器一行都没写。
#
# 字段名全是 BWIKI wikitext 里的原样参数名。来源：
#   * ~/workspace/proactivity/burners/genshin-research-REPORT.md（11 节预研）
#   * ~/workspace/proactivity/burners/genshin.yaml.draft（v0.4 映射草稿）
#   * genshin-scratch/template_merged_params.json（607 模板 declared/used_in_articles）
# 全量抓完再用 tools/audit_pages.py 复核一遍。
#
# 和明日方舟配置的三处关键差异（都落在通用开关上，没为原神加分支）：
#   1. descend_html_tags: true —— BWIKI 把实体模板全裹在
#      `<div class="row"><div class="col-sm-8">{{角色 …}}</div></div>` 里，
#      老算法只认挂在页面根上的模板，优菈页根上只有 5 个（面包屑/角色导航/…），
#      递归有 76 个。开这个开关穿透 HTML 容器但不穿透其它模板。
#   2. strip_template_name_comments: true —— 有作者写成
#      `{{系列任务<!-- 森林书等嵌套系列任务可将模板名改为多重系列任务 -->|…}}`，
#      注释整个落在模板名里，不剥一个都匹配不上。
#   3. title_patterns 的 `skip: true` —— `^Data:` 是 32,561 篇地图数据页
#      （SMW 的 Data: 伪命名空间，全在 ns0 的 allpages 里），fetch 直接不抓。
name: genshin
label: 原神
wiki_base: https://wiki.biligame.com/ys
api_url: https://wiki.biligame.com/ys/api.php
user_agent: anisignal-kb/0.1 (offline knowledge-base build; polite 1.2 req/s)
data_dir: data/genshin
eval_dir: eval/genshin
chunk_id_prefix: genshin
collection: genshin_kb
namespaces: [0]

fetch:
  rps: 1.2                 # 实测 0.8s 延时无 429；Tengine+Varnish 前端，无限流响应头
  batch_titles: 50         # 实测 50 篇/批稳定（最大响应 ~500KB）。碧蓝那边 20 是因为有
                           # MB 级大页；原神页宽中位 1.3KB，只有 邮件(213KB)/北陆图书馆(41KB)
                           # 两个超大页，50 稳
  timeout: 180             # 单次 curl 超时（秒）
  max_retries: 6           # 超时/5xx/429 的重试次数
  backoff_cap: 60          # 指数退避上限（秒）
  shard_pages: 500
  # 注意：走本机 egress 代理时 urllib 必挂（CONNECT 隧道超时），抓取必须用 curl 子进程
  # 注意：prop=revisions 不能带 rvlimit（invalidparammix），最新修订是默认行为

chunk:
  min: 60
  target: 420
  max: 900
  # 碧蓝用 voice_field_suffix 认 infobox 里的台词字段；原神台词不在 infobox 里，
  # 在独立的「X语音」页（129 篇），由 infobox_templates 的 角色语音表头/角色/语音1 认 kind，
  # 所以这个后缀在原神一个字段都不命中——保留默认值，语音内容走模板数据 chunk。
  voice_field_suffix: 台词
  fields_chunk_min: 60
  max_images_per_page: 16

parse:
  min_infobox_fields: 3    # 成就集相关名片 只有 1 参、风之翼图鉴 6 参，门槛高了白瞎一类

  # 实体模板裹在 div 里（见文件头第 1 条）
  descend_html_tags: true
  # 模板名里嵌 HTML 注释（见文件头第 2 条）
  strip_template_name_comments: true
  # to_plain 之前先用正则删解析函数。原神的 SMW 查询
  # `{{#ask:[[分类:奇偶互动]]\n|?名称\n|?稀有度\n…}}` mwparserfromhell 拆不出
  # 完整模板树（拆成 Text('{{#ask:') + Wikilink + Text('\\n|?名称…') 一串碎片），
  # 一页能有好几个，不删就是一坨 DSL 原文漏进正文 chunk
  strip_parser_functions: true

  # 展示型模板：参数顺序是给机器用的，通用兜底只会掏出机器值。
  #   {{卡牌图标|UI|元素|冰}}                UI/元素 是 key，冰 在 3（200 次）
  #   {{player|钟离_初次见面…}}              音频播放器壳，一个字符都不该出现（5,985 次）
  # 值 = 按顺序渲染哪几个参数；空列表 = 渲染成空。
  #
  #   {{颜色|蓝|100%/125%/150%/175%/200%}}   色值在1、正文在2（2,171 次）
  #   {{卡牌图标|UI|元素|冰}}                UI/元素 是 key，冰 在 3（200 次）
  #   {{player|钟离_初次见面…}}              音频播放器壳，一个字符都不该出现（5,985 次）
  #   {{图标|…}}                            双约定，见下
  # 值 = 按顺序渲染哪几个参数；空列表 = 渲染成空。
  #
  # {{图标}} 有两套并存的参数约定（实测 174 篇里 1,692 : 418，前者 4 倍）：
  #   {{图标|雷史莱姆|5}}        默认分支 `|{{{1|}}}=`，1=名字、2=数量
  #   {{图标|材料|摩拉|1575}}    显式类型分支，1=类型 key、2=名字、3=数量
  # 类型 key 只有 19 个（圣遗物小/圣遗物大/食物/材料/材料小/材料大/书籍/小/中/大/
  # 风之翼/命之座/生物*/任务/邀约任务/名片/名片小）。"渲染 1、2" 对两种约定都是
  # 严格变好：前者多带上数量，后者至少把名字留下（只多个"材料"字样）；反过来
  # 只渲染 2 会让占多数的名字派整段消失。
  display_templates:
    颜色: ["2"]              # 色值在 1，给人看的文字在 2（{{颜色|冰|冰元素伤害}}）
    图标: ["1", "2"]         # 见下面的双约定说明
    图标/小: ["2"]
    卡牌图标: ["3"]
    角色推荐: ["1", "2"]     # {{角色推荐|{{图标/角色|…}}|推荐语}}
    星期: []                 # {{星期|1}} 星期图标，渲染出来就是个光秃秃的数字
    筛选项: []                # {{筛选项|1|5|…}} 筛选器状态，正文里只剩编号
    提示: ["2"]              # {{提示|蓝色|[[链接]]}}
    折叠: ["标题"]            # 折叠块标题是真内容，"开始"不是
    折叠面板: ["标题"]
    角色技能: []              # {{角色技能|开始}}/{{角色技能|内容1开始}} 纯 UI 状态
    切换板: []                # {{切换板|开始}}/{{切换板|默认显示|…}}
    面包屑: []                # 面包屑在 payload 的 source_title 里已经有
    # SMW 查询/解析函数：正文里原样留着就是一大坨 DSL。列表页靠 nav 前缀在
    # 模板数据 chunk 里挡掉了，但 to_plain 走正文路，得在这儿再挡一次
    "#ask": []
    "#show": []
    "#info": []
    "#set": []
    "#tag": []
    "#arraymap": []
    "#loop": []
    "#invoke": []
    "#lsth": []
    "#css": []
    player: []
    Player: []
    player1: []
    Player1: []
    player2: []
    Player2: []
    "#section-h": []          # {{#section-h:角色贺图/节日贺图|2022情人节·优菈}} 转含标记

  # infobox 白名单：模板名 → (kind, category)。命名空间 10 下的模板名（不带"模板:"）。
  # 一个页命中哪个 kind 由【文档顺序里第一个】白名单模板决定，所以子模板（角色/属性数据、
  # 怪物技能、剧情选项…）故意不进来——它们在父实体后面出现，进来只会抢戏。
  # 唯一的例外是语音页：角色语音表头 和 角色/语音1 都是 voice，谁先出现都是 voice。
  # 页数 = list=embeddedin 精确计数（叶子实体模板的计数等于直接调用数）。
  infobox_templates:
    # ---- 角色（页 = 角色 + 属性数据 + 信息 + 故事 + 命之座 + 突破简 + 天赋技能 拼成）----
    角色: {kind: character, category: character}          # 133 页
    角色新: {kind: character, category: character}         # 0 页，新版未普及，留作兜底
    旅行者/通用: {kind: character, category: character}     # wrapper，不是独立页
    # ---- 武器 ----
    武器图鉴: {kind: weapon, category: weapon}              # 252 页；47 参含等级网格
    武器图鉴旧: {kind: weapon, category: weapon}            # 2 页（昆吾断虹/琥珀玥），14 参
    # ---- 圣遗物 ----
    圣遗物套装: {kind: artifact, category: artifact_set}    # 66 页；套装级 9 参 + 五部位各 3
    # ---- 敌人 ----
    怪物信息栏: {kind: enemy, category: enemy}              # 572 页；111 参（8 元素×8 段抗性、5 段血量）
    # ---- 材料/道具/食物 ----
    素材图鉴: {kind: material, category: material}          # 815 页；20 参
    消耗品图鉴: {kind: consumable, category: consumable}    # 700 页；16 参（旋曜玉帛/小道具/兑换券）
    食物图鉴新: {kind: food, category: food}                # 457 页；28 参（正常/完美/失败/特殊+食谱）
    任务道具: {kind: quest_item, category: quest_item}      # 1,278 页；16 参
    # ---- 野生生物 ----
    野生生物图鉴: {kind: wildlife, category: wildlife}      # 223 页；实体页标题是「生物志：X」
    # ---- NPC / 任务 ----
    NPC: {kind: npc, category: npc}                         # 2,810 页（最大实体类）；38 参
    任务: {kind: quest, category: quest}                    # 2,100 页（第二大）；传说/魔神/世界/委托
                                                            #   全走这个模板，用 任务类型 字段区分
    系列任务: {kind: quest_series, category: quest_series}  # 379 页
    多重系列任务: {kind: quest_series, category: quest_series}  # 93 页（森林书等嵌套系列）
    传说任务: {kind: quest, category: legend_quest}         # 仅 4 页
    邀约事件: {kind: quest, category: date_quest}           # 仅 18 个 hub 页，每日委托正文在页内
    # ---- 书籍 ----
    书籍: {kind: book, category: book}                      # 105 页；57 参 = 卷1-12 × 4
    # ---- 七圣召唤 ----
    卡牌: {kind: tcg_card, category: tcg_card}              # 650 页；实体页标题「卡牌：X」
    卡牌/词条解释: {kind: tcg_term, category: tcg_term}     # 527 页；标题「卡牌：词条解释/X」
                                                            #   ⚠️ 正文写成 {{模板:卡牌/词条解释}}，
                                                            #   template_name() 会剥掉 模板: 前缀
    卡牌通用道具: {kind: tcg_prop, category: tcg_prop}      # 47 页（牌背/台面）
    # ---- 尘歌壶 / 装扮 ----
    摆设图鉴: {kind: furnishing, category: furnishing}      # 2,417 页；17 参
    摆设套装图鉴: {kind: furnishing_set, category: furnishing_set}  # 109 页；13 参
    # 角色衣装是"老版衣装"（芭芭拉海风之梦那种），和 奇偶装扮（千星奇域单件）、
    # 装扮套装（千星奇域整套）是三代并存的三套模板，参数名大同小异，都归 costume
    角色衣装: {kind: costume, category: costume}            # 119 页
    装扮套装: {kind: costume, category: qiyu_costume_set}   # 119 页（千星奇域整套）
    奇偶装扮: {kind: costume, category: qiyu_costume}       # 2,204 页（千星奇域单件）
    风之翼图鉴: {kind: glider, category: glider}            # 18 页；6 参
    名片: {kind: namecard, category: namecard}              # 291 页；13 参
    成就集相关名片: {kind: achievement_namecard, category: achievement_namecard}  # 71 页；1 参
    # ---- 千星奇域 / 秘境 / 其它 ----
    大厅设施: {kind: lobby_facility, category: lobby_facility}  # 169 页；9 参
    奇偶互动: {kind: qiyu_interaction, category: qiyu_interaction}  # 119 页；8 参
    角色攻略头: {kind: character_guide, category: character_guide}  # 128 页「X/攻略」子页，0 参纯渲染头
    角色/家园信息: {kind: character_home, category: character_home}  # 119 页「X/家园」子页
    角色/幻想真境剧诗: {kind: mimegrand_character, category: mimegrand_character}  # 116 页
    秘境副本: {kind: domain, category: domain}              # 52 页；88 参 = 难度1-6 × 12 字段
    秘境关卡: {kind: domain_level, category: domain_level}  # 仅 3 个列表页
    游迹图鉴: {kind: travel_trace, category: travel_trace}  # 23 页；标题「游迹·X」
    讨伐列表: {kind: hunt_list, category: hunt_list}        # 10 页；18 参（三层深渊）
    纪行: {kind: battlepass, category: battlepass}          # 仅 1 页；228 参（奖励格子 01-/01-a- 编号）
    活动信息: {kind: event, category: event}                # 525 页（历史活动 hub）
    文章模板: {kind: article, category: article}            # 245 页（攻略/公告/搬运文章）
    教程: {kind: tutorial, category: tutorial}              # 688 页；标题「教程：X」
    # ---- 角色语音页（129 篇「X语音」）----
    # 语音页的模板顺序：需要帮助角色语音 → 面包屑 → 角色导航 → 语音tab样式 → 角色语音表头
    #   → 一堆 角色/语音1/角色/语音。前四个都是导航噪音，所以表头总是第一个白名单命中。
    # 旅行者语音/空 等 4 页没有表头，落到 角色/语音1，一样是 voice。
    角色语音表头: {kind: voice, category: voice}            # 123 页；4 参（四语 CV）
    角色/语音1: {kind: voice, category: voice}              # 7,399 次调用 / 120 页（主力）
    角色/语音: {kind: voice, category: voice}               # 1,509 次 / 28 页（旧版，四语分开填）

  infobox_template_prefixes: {}

  legacy_infobox_template_names: []

  # 没有 infobox 的页按标题兜底判 kind；`skip: true` 的条目 fetch 阶段直接不抓。
  # 顺序即优先级：具体的排前面（^卡牌：词条解释/ 要在 ^卡牌： 前面）。
  title_patterns:
    - {regex: '^Data:', skip: true}                    # 32,561 篇地图数据页，全跳
    - {regex: '^生物志：', kind: wildlife}              # 222 页，野生生物实体页标题前缀
    - {regex: '^卡牌：词条解释/', kind: tcg_term}       # 532 页
    - {regex: '^卡牌：', kind: tcg_card}                # 650 页七圣召唤卡牌
    - {regex: '^牌背：|^台面：', kind: tcg_prop}
    - {regex: '^教程[:：]', kind: tutorial}
    - {regex: '/攻略$', kind: character_guide}
    - {regex: '/家园$', kind: character_home}
    - {regex: '/幻想真境剧诗$', kind: mimegrand_character}
    - {regex: '^游迹·', kind: travel_trace}
    - {regex: '^邀约事件·', kind: quest}
    - {regex: '^旅行者语音/', kind: voice}              # 4 个漏网的语音页
    - {regex: '语音$', kind: voice}                     # 133 个 X语音 页（兜底）
    - {regex: '^摆设：', kind: furnishing}
    - {regex: '^图纸|^套装图纸', kind: furnishing}       # 501 页摆设图纸

  # 原神所有 kind 都是新的，card 一律走 x 前缀 chunk_id 计数器，不挤占任何老 id
  new_kinds: [character, weapon, artifact, enemy, material, consumable, food, wildlife,
              npc, quest, quest_series, book, tcg_card, tcg_term, tcg_prop,
              furnishing, furnishing_set, costume, glider, namecard, achievement_namecard,
              battlepass, event, domain, domain_level, travel_trace, hunt_list,
              quest_item, tutorial, article, lobby_facility, character_guide,
              character_home, qiyu_interaction, mimegrand_character, voice]

  card_field_keys: {}

  # PRTS/BWIKI 的导航/样板模板（切 chunk 时整段丢弃）。按前缀收，子页名自动归队。
  # ⚠️ 三个名字故意不在列表里，它们是实体模板：文章模板、角色语音表头、卡牌/词条解释。
  # ⚠️ 也不放裸 卡牌/角色/秘境/素材/图标 这种会吞实体名的前缀——is_nav_template 是
  #    "等于 或 前缀+/" 匹配，但 卡牌通用道具/角色攻略头 经不起手滑。
  nav_template_prefixes:
    - 原神WIKI导航
    - 导航
    - 导航栏
    - 面包屑
    - 图鉴导航
    - 角色导航
    - 角色图鉴导航
    - 武器导航
    - 圣遗物导航
    - 怪物图鉴导航
    - 生物志导航
    - 图书馆导航栏
    - 卡牌图鉴导航
    - 筛选
    - 筛选项
    - 列表筛选
    - 图鉴筛选
    - 轮播图
