[project]
name = "anisignal-server"
version = "0.1.0"
description = "AniSignal backend: collectors, scheduler, workers and admin API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncmy>=0.2.9",
  "pymysql>=1.1",
  "alembic>=1.13",
  "arq>=0.26",
  "redis>=5.0",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "aiosmtplib>=5.1.2",
  "bleach>=6.4.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "aiosqlite>=0.20",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
