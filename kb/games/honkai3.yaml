# 崩坏3（Honkai Impact 3rd，BWIKI 崩坏3站）——第四款游戏。
#
# 站点选择（2026-10-19 逐个候选 api.php?action=query&meta=siteinfo 核过）：
#   wiki.biligame.com/bh3            articles 1538 / ns0 全量 1837 篇  ← 选它
#   honkaiimpact3.fandom.com/zh      api.php 直接 404
#   bh3.huijiwiki.com                Cloudflare "Just a moment..."，API 拿不到
#                                   （和 MLH Turnstile 一个毛病，别在云环境里硬刚）
#   bh3.mihoyo.com                    没有 api.php（官网，不是 wiki）
#
# 结构化路照方舟/鸣潮的写法全走 parse.kinds 通用实体路（entities + entity_attrs +
# YAML 里声明的子表），kblib/extractors/ 下一个字都没写。
# 字段名全部是崩坏3 BWIKI wikitext 里的原样参数名——tools/recon_honkai3.py 扫全量
# 顶层模板分布 + 逐个模板参数并集核对出来的（1837 篇里抽 400 篇均匀样本，
# 明细落 data/honkai3/recon_templates.json），不是猜的。
name: honkai3
label: 崩坏3
wiki_base: https://wiki.biligame.com/bh3
api_url: https://wiki.biligame.com/bh3/api.php
user_agent: anisignal-kb/0.1 (offline knowledge-base build; polite 1 req/s)
data_dir: data/honkai3
eval_dir: eval/honkai3
chunk_id_prefix: honkai3
collection: honkai3_kb
namespaces: [0]

fetch:
  rps: 1.0                 # BWIKI 是公共服务，和鸣潮一样按 1 req/s 客气来
  batch_titles: 20
  timeout: 180
  max_retries: 6
  backoff_cap: 60
  shard_pages: 500

chunk:
  min: 60
  target: 420
  max: 900
  voice_field_suffix: 台词
  fields_chunk_min: 60
  max_images_per_page: 16

parse:
  min_infobox_fields: 3

  # BWIKI 的模板名后面普遍嵌 HTML 注释：崩坏3 的
  # `{{女武神装甲 | <!--- 基本信息 ---> | |装甲名=…}}`、`{{圣痕图鉴\n|圣痕名=…<!---此处仅填写圣痕名字--->}}`
  # 注释整个落在模板名和参数位置里。不剥的话 infobox 白名单一个都匹配不上。
  strip_template_name_comments: true

  # 展示型模板：人看的值在**位置参数 1**里，通用兜底只会取出机器值。
  # 注意和鸣潮的 {{颜色|技能|普攻}}（机器键在 1、人看的在 2）正好相反——
  # 崩坏3 这套是包色高亮，`{{蓝色|8.0}}` `{{黄色|QTE}}` `{{黄色|3.0%}}`，
  # 内容本身就是参数 1。全量 1837 篇普查过的实际出现次数：
  #   黄色 250 次/13 页、蓝色 4 次/2 页、紫色 1 次——没有一个多参数用法，
  #   所以取 1 就够，取 2 会把整页技能描述变成空串。
  #   红/绿/灰/橙 全库一次都没出现，列在这儿只是防新增页面踩空。
  display_templates:
    蓝色: ["1"]              # {{蓝色|8.0}} 秒 / {{蓝色|跳向目标敌人，…}} 整段技能描述
    黄色: ["1"]              # {{黄色|QTE}}-审判天枪 / {{黄色|3.0%}}
    紫色: ["1"]              # {{紫色|狂热}}{{蓝色|蓝调}}
    红色: ["1"]
    绿色: ["1"]
    灰色: ["1"]
    橙色: ["1"]
    黑幕: ["1"]              # 剧透黑幕，{{黑幕|西琳}} 里裹的正是昵称/萌点的正题，
                             # 渲染成空会把"草履虫、西琳、K423"这种昵称砍掉一半
    # 纯布局/导航：一个字符都不该出现在正文里
    面包屑: []

  # infobox 白名单：模板名 → (kind, category)。全是"命名参数即结构"的图鉴模板，
  # 全量 1837 篇普查（--from-raw）的命中篇数：
  #   圣痕图鉴 458 / 武器图鉴 263 / 圣痕套装 128 / 女武神装甲 94 / 勋章 67 /
  #   宿舍名册 54 / 宿舍圣痕名册 38 / 角色 32 / BOSS图鉴 27 / 家具图鉴 17 /
  #   人偶 8 / SP装甲 12（从不单独出现，走 child_templates）
  # 另有一个别名页：`{{武器图}}`（异型·赫尔之弓 1 篇，全库仅此一页，参数名和
  # 武器图鉴 一字不差）——全量普查按"参数命中已知字段数"扫出来的漏收，补成别名，
  # 否则这页武器只能走 prose 补捞、查表探针问不到它的攻击/会心。
  # 现在补是零成本的：honkai3_kb 还是 0 向量，chunk 的 x-id 还没有任何东西依赖。
  # 位置参数型的模板（文章戳/按钮/官方宣传PV/攻略配队…）故意不收：infobox_fields 会丢掉
  # 数字名参数，收进来只会得到空字段 + 把页面 kind 带偏，它们的内容由
  # template_dump / display_templates 两条补捞路兜住。
  infobox_templates:
    圣痕图鉴: {kind: stigmata, category: stigmata}
    圣痕套装: {kind: stigmata_set, category: stigmata_set}
    武器图鉴: {kind: weapon, category: weapon}
    武器图: {kind: weapon, category: weapon}   # 别名，仅"异型·赫尔之弓"1 页
    女武神装甲: {kind: battlesuit, category: battlesuit}
    角色: {kind: character, category: character}
    宿舍名册: {kind: dorm_roster, category: dorm_roster}
    宿舍圣痕名册: {kind: dorm_stigmata, category: dorm_stigmata}
    BOSS图鉴: {kind: boss, category: boss}
    勋章: {kind: badge, category: badge}
    家具图鉴: {kind: furniture, category: furniture}
    人偶: {kind: elf, category: elf}

  infobox_template_prefixes: {}

  legacy_infobox_template_names: []

  # 剧情章节页（视觉小说）没有 infobox，按标题认出成一族，报表里能和道具页分开
  title_patterns:
    - {regex: '^主线', kind: story}

  new_kinds: [stigmata, stigmata_set, weapon, battlesuit, character,
              dorm_roster, dorm_stigmata, boss, badge, furniture, elf, story]

  # 空：长描述字段照旧进 card_fields（让实体名和效果文本同 chunk，修掉"图鉴字段
  # chunk 一个字都不带页名所以召不回本页"的短板），但**不**从 fields chunk 里剔掉
  # ——chunk 条数一分不变、chunk_id 逐个稳定，parse 重跑/增量 embed 都只原地覆盖。
  card_field_keys: {}

  # 切 chunk 时整段丢弃的导航/样板模板（按前缀收，is_nav_template 是 startswith 匹配，
  # 所以"首页"一并收掉 首页角色/首页武器/首页词条，"筛选"收掉 筛选项 和带
  # `模板:` 全前缀的 模板:筛选项——template_name 会先剥掉命名空间）。
  # 全量普查新认出来的几族：
  #   按钮     331 次/8 页，{{按钮|目标页|显示文字}} 的纯导航链（动画短片/主线章节/游戏音乐目录）
  #   文章戳   245 页，攻略/公告页的元数据壳（上级页面/时间/作者/来源/原文地址），不是游戏知识
  #   官方宣传PV 55 页，转植壳
  #   首页*    首页导航轮播；筛选项 索引页的筛选 UI；网易云音乐 外嵌播放器
  #   施工中    3 页的"本篇待补"提示；更新日志 首页的 changelog
  nav_template_prefixes:
    - 导航
    - 面包屑
    - pathnav
    - 文章戳
    - 按钮
    - 首页
    - 筛选
    - 官方宣传PV
    - :官方宣传PV         # 站上写的是 {{:官方宣传PV}}（冒号=转植普通页当模板用），
                          # template_name 只剥 "模板:" 不剥冒号，所以两种写法都得列
    - 阵营战
    - :阵营战
    - 网易云音乐
    - 施工中
    - 更新日志

  noise_section_keywords:
    - 导航
    - 分类
    - 参见
    - 外部链接
    - 参考文献
    - 注释
    - 更新历史
    - 更新日志
    - 公告
    - 统计信息
    - 模型
    - 相关页面

  # ---------------- 通用实体路：12 族的 kind spec ----------------
  kinds:

    stigmata:                     # 圣痕（单件），~455 页，全库最大一族
      name_fields: [圣痕名]
      card_fields:
        - [套装名, 套装名]
        - [稀有度, 稀有度]
        - [位置, 位置]
        - [生命, 生命]
        - [防御, 防御]
        - [攻击, 攻击]
        - [会心, 会心]
        - [技能, 技能]
        - [技能效果, 技能效果]    # 中位 ~50 字，是"这件圣痕有什么用"的答案所在，
                                 # 进卡片才能和圣痕名同 chunk 被召回
        - [特性, 特性]
        - [推荐角色, 推荐角色]
        - [获取方式, 获取方式]
      attr_fields: [圣痕名, 套装名, 稀有度, 位置, 生命, 防御, 攻击, 会心, 介绍,
                    技能, 技能效果, 特性, 推荐角色, 备注, 获取方式,
                    套装技能1, 套装技能1效果, 套装技能2, 套装技能2效果]

    stigmata_set:                 # 圣痕套装（两件/三件套效果），~106 页
      name_fields: [套装名]
      card_fields:
        - [套装圣痕名, 套装圣痕名]
        - [套装稀有度, 套装稀有度]
        - [套装技能1, 套装技能1]
        - [套装技能1效果, 套装技能1效果]
        - [套装技能2, 套装技能2]
        - [套装技能2效果, 套装技能2效果]
        - [特性, 特性]
        - [推荐角色, 推荐角色]
      attr_fields: [套装名, 套装圣痕名, 套装稀有度, 套装技能1, 套装技能1效果,
                    套装技能2, 套装技能2效果, 特性, 推荐角色, 备注]

    weapon:                       # 武器，~184 页
      name_fields: [武器名]
      card_fields:
        - [武器类型, 武器类型]
        - [稀有度, 稀有度]
        - [攻击, 攻击]
        - [会心, 会心]
        - [武器技能1, 武器技能1]
        - [武器技能2, 武器技能2]
        - [武器技能3, 武器技能3]
        # 技能效果/介绍是长描述，排在最后：bge 512 截断只砍尾巴，
        # 前面的类型/攻击/技能名不能丢（鸣潮 weapon 一族同样的排法）
        - [武器技能1效果, 武器技能1效果]
        - [武器技能2效果, 武器技能2效果]
        - [武器技能3效果, 武器技能3效果]
        - [介绍, 介绍]
        - [特性, 特性]
        - [超限, 超限]
        - [推荐角色, 推荐角色]
        - [获取方式, 获取方式]
      attr_fields: [武器名, 武器类型, 稀有度, 生命, 攻击, 会心,
                    武器技能1, 武器技能1效果, 武器技能2, 武器技能2效果,
                    武器技能3, 武器技能3效果, 介绍, 特性, 超限, 推荐角色,
                    获取方式, 备注]

    battlesuit:                   # 女武神装甲，~101 页（137 个参数，字段最杂的一族）
      name_fields: [装甲名]
      card_fields:
        # 先身份和短字段（稀有度/属性/特色/觉醒），再技能名，最后技能效果——
        # 效果文本动辄两三百字，排前面会把身份挤出 512 截断
        - [角色名, 角色名]
        - [稀有度, 稀有度]
        - [属性, 属性]
        - [简称, 简称]
        - [特色, 特色]
        - [技能特效, 技能特效]
        - [灵魂觉醒, 灵魂觉醒]
        - [增幅核心, 增幅核心]
        - [队长技, 队长技]
        - [闪避, 闪避]
        - [被动, 被动]
        - [普攻, 普攻]
        - [必杀, 必杀]
        - [特殊, 特殊]
        - [队长技效果, 队长技效果]
        - [闪避效果, 闪避效果]
        - [被动效果, 被动效果]
        - [普攻效果, 普攻效果]
        - [必杀效果, 必杀效果]
        - [特殊效果, 特殊效果]
      # 全字段进 entity_attrs：查表探针按 attr 直接问"空之律者的必杀精通1叫什么"
      attr_fields: [装甲名, 角色名, 简称, 稀有度, 属性, 特色, 技能特效, 队友增益,
                    需要特效, 灵魂觉醒, 增幅核心, 生命, 能量, 攻击, 防御, 会心,
                    换装1, 换装1获取方式, 换装2, 换装2获取方式, 换装3, 换装3获取方式,
                    换装4, 换装4获取方式, 换装5, 换装5获取方式, 换装6, 换装6获取方式,
                    队长技, 队长技效果, 队长技精通1, 队长技精通1效果,
                    被动, 被动效果, 被动精通1, 被动精通1效果,
                    被动精通2, 被动精通2效果, 被动精通3, 被动精通3效果,
                    闪避, 闪避效果, 闪避精通1, 闪避精通1效果,
                    闪避精通2, 闪避精通2效果, 闪避精通3, 闪避精通3效果,
                    普攻, 普攻效果, 普攻精通1, 普攻精通1效果,
                    普攻精通2, 普攻精通2效果, 普攻精通3, 普攻精通3效果,
                    必杀, 必杀效果, 必杀精通1, 必杀精通1效果,
                    必杀精通2, 必杀精通2效果, 必杀精通3, 必杀精通3效果,
                    特殊, 特殊效果, 特殊精通1, 特殊精通1效果,
                    特殊精通2, 特殊精通2效果, 特殊精通3, 特殊精通3效果,
                    联机技能, 联机技能效果, 词缀推荐,
                    新手武器, 新手上位, 新手中位, 新手下位,
                    肝物武器, 肝物上位, 肝物中位, 肝物下位,
                    毕业武器, 毕业上位, 毕业中位, 毕业下位,
                    毕业武器2, 毕业上位2, 毕业中位2, 毕业下位2,
                    毕业武器3, 毕业上位3, 毕业中位3, 毕业下位3,
                    毕业武器4, 毕业上位4, 毕业中位4, 毕业下位4,
                    毕业武器5, 毕业上位5, 毕业中位5, 毕业下位5,
                    生命a, 能量a, 攻击a, 防御a, 会心a,
                    生命b, 能量b, 攻击b, 防御b, 会心b,
                    生命s, 能量s, 攻击s, 防御s, 会心s,
                    生命ss, 能量ss, 攻击ss, 防御ss, 会心ss,
                    生命sss, 能量sss, 攻击sss, 防御sss, 会心sss]
      child_templates:
        # SP 装甲的技能块：和 女武神装甲 同在一条目页上（夜隐重霞/戒律·深罪之槛/
        # 朔夜观星/无限·噬界之蛇/繁星·绘世之卷/螺旋·愚戏之匣 6 页全部如此），
        # 所以走 child_templates 而不是独立 kind。SP技能N 是编号字段，拆行进子表。
        - template: SP装甲
          table: h3_battlesuit_sp_skills
          rows_from:
            - pattern: '^SP技能(\d+)$'
              columns: {index: '{0}', name: '@key', effect: 'SP技能{0}效果'}

    character:                    # 角色档案（中文名/CV/三围/萌点…），~23 页
      name_fields: [中文名]
      card_fields:
        - [日文名, 日文名]
        - [英文名, 英文名]
        - [昵称, 昵称]
        - [爱好, 爱好]
        - [身高, 身高]
        - [体重, 体重]
        - [三围, 三围]
        - [cv, cv]
        - [萌点, 萌点]
        - [生日, 生日]
        - [年龄, 年龄]
        - [出身地区, 出身地区]
        - [所属, 所属]
        - [活动范围, 活动范围]
        - [个人状态, 个人状态]
        - [是否上舰, 是否上舰]
      attr_fields: [中文名, 日文名, 英文名, 昵称, 爱好, 身高, 体重, 三围, cv,
                    萌点, 生日, 年龄, 出身地区, 所属, 活动范围, 个人状态, 是否上舰]

    dorm_roster:                  # 家园名册·装甲（宿舍里的角色卡），~64 页
      name_fields: [装甲名]
      card_fields:
        - [角色名, 角色名]
        - [生日, 生日]
        - [身高, 身高]
        - [性别, 性别]
        - [体重, 体重]
        - [所属组织, 所属组织]
        - [出生地, 出生地]
        # 三个故事字段是这页的正文价值所在（中位两三百字），排在最后
        - [女武神装甲故事1, 女武神装甲故事1]
        - [女武神装甲故事2, 女武神装甲故事2]
        - [女武神装甲故事3, 女武神装甲故事3]
      attr_fields: [装甲名, 角色名, 生日, 身高, 性别, 体重, 所属组织, 出生地,
                    女武神装甲故事1, 女武神装甲故事2, 女武神装甲故事3]

    dorm_stigmata:                # 家园名册·圣痕（圣痕化身的角色卡），~37 页
      name_fields: [名称]
      card_fields:
        - [所属分类, 所属分类]
        - [活跃, 活跃]
        - [身高, 身高]
        - [属性, 属性]
        - [体重, 体重]
        - [卓越领域, 卓越领域]
        - [出生地, 出生地]
        # 五个记忆片段同理，长文本垫后
        - [圣痕记忆片段1, 圣痕记忆片段1]
        - [圣痕记忆片段2, 圣痕记忆片段2]
        - [圣痕记忆片段3, 圣痕记忆片段3]
        - [圣痕记忆片段4, 圣痕记忆片段4]
        - [圣痕记忆片段5, 圣痕记忆片段5]
