services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-anisignal}
      MYSQL_DATABASE: anisignal
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-anisignal}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./server
    restart: unless-stopped
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    environment: &app_env
      ANISIGNAL_DATABASE_URL: mysql+asyncmy://root:${MYSQL_ROOT_PASSWORD:-anisignal}@mysql:3306/anisignal
      ANISIGNAL_REDIS_URL: redis://redis:6379/0
      ANISIGNAL_ADMIN_TOKEN: ${ANISIGNAL_ADMIN_TOKEN:-change-me}
      ANISIGNAL_CORS_ORIGINS: ${ANISIGNAL_CORS_ORIGINS:-http://localhost:3000,http://154.40.58.230:8090}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # 公网可达（web 前端从浏览器直连此 API）；上域名/HTTPS 后建议收回反代后
      - "${API_PORT:-8000}:8000"

  web:
    build: ./web
    restart: unless-stopped
    environment:
      # 浏览器直连的 API 地址（不是容器内地址）
      NUXT_PUBLIC_API_BASE: ${PUBLIC_API_BASE:-http://154.40.58.230:8000}
    ports:
      - "${WEB_PORT:-8090}:3000"
    depends_on:
      - api

  scheduler:
    build: ./server
    restart: unless-stopped
    command: python -m app.scheduler.loop
    environment: *app_env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./server
    restart: unless-stopped
    command: arq app.worker.settings.WorkerSettings
    environment: *app_env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
