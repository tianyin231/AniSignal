# 绝区零（Zenless Zone Zero，BWIKI 绝区零站）——第四款游戏。
#
# 站点的坑：BWIKI 上 `zzz` 这个子域**就是**绝区零（siteinfo 的 sitename 是
# "绝区零WIKI_BWIKI_哔哩哔哩"），但按游戏英文名猜的 `zenlesszonezero` 子域不存在
# （api.php 直接无响应）。候选对比：
#   wiki.biligame.com/zzz              pages 5552 / articles 1037 / images 3924  ← 选它
#   zenlesszonezero.fandom.com        英文站（302 到 zenless-zone-zero.fandom.com），配不上 bge-small-zh
#   zzz.huijiwiki.com                 Cloudflare "Just a moment..." 拦截，抓不动
#
# 另一个坑：**BWIKI 的代理人页用短名当页标题**。`星见雅` 是 `#重定向[[雅]]`，
# 页标题只有 `雅`；`安比·德玛拉` 同理重定向到 `安比`。全名/英文名都在
# `角色图鉴` 的 全名/英文名称 字段里，别按全名去找页。
#
# 结构化路照方舟/鸣潮的写法全走 parse.kinds 通用实体路（entities + entity_attrs +
# YAML 里声明的子表），kblib/extractors/ 下一个字都没写。
# 字段名都是绝区零 BWIKI wikitext 里的原样参数名（1160 篇全量抓完，扫顶层模板分布
# + 逐个模板的参数并集核对的），不是猜的。
name: zzz
label: 绝区零
wiki_base: https://wiki.biligame.com/zzz
api_url: https://wiki.biligame.com/zzz/api.php
user_agent: anisignal-kb/0.1 (offline knowledge-base build; polite 1 req/s)
data_dir: data/zzz
eval_dir: eval/zzz
chunk_id_prefix: zzz
collection: zzz_kb
namespaces: [0]

fetch:
  rps: 1.0                 # BWIKI 是公共服务，比 PRTS 更禁不起折腾
  batch_titles: 20
  timeout: 180
  max_retries: 6
  backoff_cap: 60
  shard_pages: 500

chunk:
  min: 60
  target: 420
  max: 900
  voice_field_suffix: 台词
  fields_chunk_min: 60
  max_images_per_page: 16

parse:
  min_infobox_fields: 3

  # BWIKI 的模板名里普遍嵌 HTML 注释（方舟的 {{CharinfoV2<!--下方为自动更新部分-->}}、
  # 星铁的活动信息、鸣潮都踩过）。绝区零的 {{角色/阵容搭配|配队<!-- 该模板用于… -->}}
  # 也是这个写法，不剥的话子模板名带注释、rows_from 一条都匹配不上。
  strip_template_name_comments: true

  # 展示型模板：人看的值在位置参数里，通用兜底只会取出机器值。
  #   {{颜色|橙|「普通攻击」}}   全站 88 处——参数 1 是机器键（橙/绿/蓝/物理/电/冰），
  #                            人看的在 2。cleantext 的 _VALUE_TEMPLATES 对"颜色"有
  #                            硬编码兜底取参数 1，不声明的话整篇技能描述变成"橙「普通攻击」"
  #   {{图标|按钮|普通攻击}}    391 处参数 1 / 122 处参数 2——两种写法都有：
  #                            {{图标|菲林|300}}（1=货币名 2=数量）和
  #                            {{图标|硫磺石}}（只有名字）。取 1+2 才不会丢名字
  #   {{图标/代理人|大|露西}} / {{图标/代理人|伊芙琳}}  同理，1 有时是"大/小"尺寸键
  #   {{提示|绿色|宽度=100%|正文}} / {{提示消息|黄色|正文}}  1 是配色，正文在 2
  #   {{切换板|开始}}/{{切换板|默认显示|常规输出}}/{{切换板|内容结束}}  纯布局标记，
  #                            一个字符都不该出现（配装/阵容段全靠它包着）
  #   {{B站视频|BV1mb421n7uh}}  BV 号对检索零价值，渲染成空
  display_templates:
    颜色: ["2"]
    图标: ["1", "2"]
    图标/音擎: ["1"]
    图标/代理人: ["1", "2"]
    图标/邦布: ["1", "2"]
    图标/时装: ["1", "2"]
    图标/驱动盘: ["1", "2"]
    图标/小: ["1"]
    提示: ["2"]
    提示消息: ["2"]
    主观提示: ["1"]
    时效提示: ["1"]
    # v3 起的技能块：{{角色/技能|普攻={{角色/技能/项|名称=…|描述=…|属性1=…}}}}。
    # 两层都声明，正文路和 template_dump 才拿得到名称+描述；只声明外层的话
    # _plain 对"全命名参数"的 角色/技能/项 兜底返回空串，37 页的技能文本整段消失。
    角色/技能: ["普攻", "闪避", "支援技", "特殊技", "连携技", "核心技"]
    角色/技能/项: ["名称", "描述"]
    # 游戏历史页的时间轴，命名参数
    时间轴: ["时间", "标题", "内容"]
    # 纯布局/导航/无关信息：渲染成空
    切换板: []
    人物出场: []
    角色生日贺图板: []
    影画展示: []
    推荐角色提示: []
    B站视频: []
    多义词: []
    施工中: []

  # infobox 白名单：模板名 → (kind, category)。都是"命名参数即结构"的图鉴模板，
  # 942/1160 页命中。位置参数型的模板（筛选项/图标/提示/切换板…）故意不收：
  # infobox_fields 会丢掉数字名参数，收进来只会得到空字段 + 把页面 kind 带偏，
  # 它们的内容由 template_dump 和 display_templates 两条路兜住。
  infobox_templates:
    角色图鉴: {kind: agent, category: agent}
    武器图鉴: {kind: wengine, category: wengine}
    材料图鉴: {kind: material, category: material}
    名片: {kind: namecard, category: namecard}
    零号空洞鸣徽: {kind: signal, category: signal}
    邦布图鉴: {kind: bangboo, category: bangboo}
    驱动盘: {kind: drivedisc, category: drivedisc}
    角色时装: {kind: skin, category: skin}
    活动信息: {kind: activity, category: activity}
    NPC: {kind: npc, category: npc}
    敌人: {kind: enemy, category: enemy}
    专辑: {kind: album, category: album}
    小游戏: {kind: minigame, category: minigame}
    攻略: {kind: guide, category: guide}
    文章戳: {kind: announcement, category: announcement}

  infobox_template_prefixes: {}

  legacy_infobox_template_names: []

  title_patterns: []

  new_kinds: [agent, wengine, material, namecard, signal, bangboo, drivedisc,
              skin, activity, npc, enemy, album, minigame, guide, announcement]

  card_field_keys: {}

  # 切 chunk 时整段丢弃的导航/样板模板（按前缀收）。
  # **注意别把图鉴模板名的前缀写进来**：is_nav_template 是 `n == p or n.startswith(p)`，
  # 写 "角色" 会连 角色图鉴/角色时装 一起吞、写 "材料" 会吞 材料图鉴、写 "驱动" 会吞
  # 驱动盘、写 "活动" 会吞 活动信息。所以这里只收确定是壳子的名字。
  nav_template_prefixes:
    - 导航
    - 面包屑
    - pathnav
    - 折叠
    - 展开
    - 板块
    - 选项卡
    - 切换标签
    - 切换板
    - CSS
    - JS
    - ResourceLoader
    - 排版
    - 颜色
    - 字体
    - Font
    - 锚点
    - 参阅
    - 消歧义
    - Math
    - 提示
    - 注意
    - 备注
    - 修正
    - 左侧目录
    - 数字滚动
    - 图片查看按钮
    - 整栏
    - 划线
    - Cquote
    - 红色
    - 颜色引用
    - 筛选
    - WIKI底部导航
    - 图鉴导航
    - 零号空洞导航
    - 图像影音导航
    - 人物出场
    - 多义词
    - 施工中
    - 主观提示
    - 时效提示
    - 推荐角色提示
    - 角色生日贺图板
    - 影画展示
    - 活动计时
    - B站视频
    - 成就合集
    - 成就一览

  noise_section_keywords:
    - 导航
    - 分类
    - 参见
    - 外部链接
    - 参考文献
    - 注释
    - 更新历史
    - 更新日志
    - 公告
    - 统计信息
    - 模型
    - 相关页面

  # ---------------- 通用实体路：15 族的 kind spec ----------------
  # name_fields  卡片标题用哪个字段当实体名（都不命中就用页标题）
  # card_fields  渲染卡片摘要 chunk 的 [标签, 字段名]。**长描述字段一律排在末尾**：
  #              bge 512 截断只砍尾巴，前面的类型/品质/技能名不能丢（鸣潮 q07/q10
  #              的教训：图鉴字段 chunk 一个字的页名都不带，答案明明在 fields chunk
  #              里却排不进来，修法是把长描述补进卡片而不是新增 per-page chunk）
  # attr_fields  额外落 entity_attrs 的字段（查表探针直接按 attr 查）
  # attr_templates 页内子模板 → entity_attrs（infobox 里没有的档案字段走这条）
  # child_templates 页内子模板 → 行。{N} 是**从 0 开始**数 m.groups() 的下标，
  #               写成 {1}/{2} 会把整表错位一格（鸣潮 1657 行 level 全是"生命"的教训）
  kinds:
    agent:                        # 代理人（角色），62 页。页标题是短名，全名在"全名"字段
      name_fields: [名称]
      card_fields:
        - [阵营, 阵营]
        - [种族, 种族]
        - [性别, 性别]
        - [稀有度, 稀有度]
        - [限定, 限定]
        - [属性, 属性]
        - [特性, 特性]
        - [伤害类型, 伤害类型]
        - [生日, 生日]
        - [身高, 身高]
        - [中文CV, 中文CV]
        - [日文CV, 日文CV]
        - [实装版本, 实装版本]
        - [昵称/外号, 昵称/外号]
        # 长描述排最后：角色定位（中位 ~200 字）是"这个角色怎么玩"的答案所在，
        # 代理人秘闻/虚狩描述同理。超 512 的尾部由 bge 砍，图鉴字段 chunk 那边一样被砍
        - [角色定位, 角色定位]
        - [代理人秘闻, 代理人秘闻]
        - [虚狩称号, 虚狩称号]
        - [虚狩描述, 虚狩描述]
      attr_fields: [名称, 全名, 英文名称, 阵营, 种族, 性别, 稀有度, 限定, 属性, 属性名称,
                    特性, 伤害类型, 实装日期, 实装版本, TAG, 昵称/外号,
                    中文CV, 日文CV, 韩文CV, 英文CV, 生日, 身高, 体型,
                    生命值, 攻击力, 防御力, 冲击力, 异常掌控, 异常精通, 能量自动回复,
                    贯穿力, 闪能自动累积, 分贝回复, 穿透值, 穿透率,
                    暴击率, 暴击伤害, 突破加成属性,
                    角色定位, 代理人秘闻, 虚狩称号, 虚狩描述, 出现版本, 独家视界, 宗师, 介绍,
                    鸣徽, 空洞鸣徽, 调频名称, 名片1, 名片2, 角色EP, 时装,
                    核心技材料A, 核心技材料S]
      # 档案不在 角色图鉴 里，在正文的 {{代理人档案}}。attr_fields 只能从 infobox 取，
      # 所以 档案1/文案/评价N 走这条补进 entity_attrs，卡片摘要也能引用
      attr_templates:
        代理人档案: [档案1, 文案, 档案人,
                     评价1, 评价人1, 评价2, 评价人2, 评价3, 评价人3, 评价4, 评价人4]
        # 法厄同（主角）用的是另一套模板名，字段同名
        代理人档案/法厄同: [档案1, 文案, 档案人,
                           评价1, 评价人1, 评价2, 评价人2, 评价3, 评价人3, 评价4, 评价人4]
      child_templates:
        # 等级属性表。**两种字段命名混在 62 页里**（扫全量才发现的）：
        #   简版 50 页：10生命值 / 10+生命值 / 60生命值
        #   详版 13 页：10前生命值 / 10后生命值 / … / 50后生命值 / 60生命值
        #   （前/后 = 该等级突破前/后；详版 10 没有"+"、60 没有"前/后"）
        # 两条 pattern 都写 level/phase/stat/value 四列，用 phase 区分——
        # 不区分的话 (10, 生命值) 会同时命中 10生命值 和 10前生命值 两种行。
        # 注意 `10+突破` 不在 (生命值|攻击力|防御力) 里，天然不会被误收。
        - template: 角色图鉴
          table: zzz_agent_stats
          rows_from:
            - pattern: '^(\d+)(前|后)(生命值|攻击力|防御力)$'
              columns: {level: '{0}', phase: '{1}', stat: '{2}', value: '@key'}
            - pattern: '^(\d+)(\+?)(生命值|攻击力|防御力)$'
              columns: {level: '{0}', phase: '{1}', stat: '{2}', value: '@key'}
        # 天赋 1~6，一页一块。倍率/效果字段几十 KB 不进表，正文路和 template_dump 兜住
        - template: 天赋
          table: zzz_agent_talents
          rows_from:
            - pattern: '^天赋(\d+)$'
              columns: {index: '{0}', name: '@key',
                        effect: '天赋{0}效果', description: '天赋{0}描述'}
        # 角色故事/档案。文案是档案正文。
        # **评价N / 评价人N 的语义在 wiki 上本身就是乱的**，别按名字猜：11号/丽娜的页
        # 评价N=特质名、评价人N=特质描述；仪玄/雅的页 评价N=别人说的原话、评价人N=说话人。
        # 所以列名直接用参数原名，不替 wiki 做语义判断。
        - template: [代理人档案, 代理人档案/法厄同]
          table: zzz_agent_profile
          columns: {档案1: 档案1, 文案: 文案, 档案人: 档案人,
                    评价1: 评价1, 评价人1: 评价人1,
                    评价2: 评价2, 评价人2: 评价人2,
                    评价3: 评价3, 评价人3: 评价人3,
                    评价4: 评价4, 评价人4: 评价人4}
        # ---- 技能：v1 平铺模板（27 页）----
        # 一张表 + kind 区分列（鸣潮 故事/珍贵之物 index 撞车的教训：同表多条
        # pattern 必须带一列 const 区分，否则 `where skill='普攻'` 拿到名称行还是
        # 描述行全看 sort）
        - template: 角色技能
          table: zzz_agent_skills
          rows_from:
            # 名称行：普攻 / 强化普攻2 / 回避支援 …（裸槽位，值就是这个技能的名字）
            # **`{N}` 的语义是"格式化之后当字段名去查"**（_resolve 里 format 完还要
            # fields.get(alias)）：`'{0}'` 单独写才走 only_group 分支返回捕获组本身，
            # `'{0}{1}'` 是用捕获组拼出字段名再取值。名称行两样都要，所以拆成
            # skill（槽位，'{0}' 拿捕获组）+ skill_name（技能名，'{0}{1}' 拼出槽位
            # 字段名去查）。**`@key` 给的是"命中字段的值"不是字段名**——写成
            # skill: '@key' 会让 skill 列变成技能名，和 skill_name 重复、槽位全丢。
            # 顺带：columns 里不能出现和 const 同名的列——_pattern_rows 先 vals.update(const)
            # 再逐列赋值，同名列会被 fields 查不到的 None 覆盖掉（鸣潮靠 const 区分
            # 故事/珍贵之物 就是这个机制，别自己把 const 冲掉）。
            - pattern: '^(普攻|强化普攻|闪避|冲刺攻击|闪避反击|特殊技|强化特殊技|连携技|终结技|支援突击|核心被动|额外能力|招架支援|快速支援|受击支援|回避支援)(\d*)$'
              columns: {skill: '{0}', skill_name: '{0}{1}'}
              const: {kind: '名称'}
            # 描述行：普攻描述 / 强化特殊技3描述 …
            - pattern: '^(.+)描述$'
              columns: {skill: '{0}', text: '@key'}
              const: {kind: '描述'}
            # 倍率行：普攻属性1 = 一段伤害倍率，值在同名 +LV 字段
            - pattern: '^(.+)属性(\d+)$'
              columns: {skill: '{0}', index: '{1}',
                        name: '@key', value: '{0}属性{1}LV'}
              const: {kind: '倍率'}
        # ---- 技能：v3 嵌套模板（37 页）----
        # {{角色/技能|普攻={{角色/技能/项|名称=…|描述=…|属性1=…}}}}，
        # 顶层模板池里没有 角色/技能/项 这个节点，必须 recursive 才找得到
        # （星铁 行迹/技能 就是这么丢的，见 _template_nodes 注释）
        - template: 角色/技能/项
          recursive: true
          occurrence: true
          table: zzz_agent_skills_v3
          columns: {skill_name: 名称, description: 描述, level_cap: 等级上限}
          rows_from:
            - pattern: '^属性(\d+)$'
              table: zzz_agent_skill_attrs
              columns: {index: '{0}', name: '@key', value: '属性{0}LV'}
        # 外层壳子也收一份：槽位名（普攻/闪避/支援技/特殊技/连携技/核心技）→ 值，
        # 配合 display_templates 里声明的 角色/技能/项，值渲染成"名称 描述"
        - template: 角色/技能
          table: zzz_agent_skills_v3_slots
          columns: {basic_attack: 普攻, dodge: 闪避, assist: 支援技,
                    special: 特殊技, chain: 连携技, core: 核心技}

    wengine:                     # 音擎（武器），97 页
      name_fields: [名称]
      card_fields:
        - [稀有度, 稀有度]
        - [副词条, 副词条]
        - [副词条数值, 副词条数值]
        - [武器属性, 武器属性]
        - [攻击力, 攻击力]
        - [获取途径, 获取途径]
        - [相关角色, 相关角色]
        - [实装版本, 实装版本]
        # 武器技能效果是这页的正文（"XX 的音擎技能有什么效果"的答案），
        # 卡片只有元数据时只能靠图鉴字段兜——同鸣潮 weapon 的教训
        - [武器技能名称, 武器技能名称]
        - [武器技能效果, 武器技能效果]
        - [武器故事, 武器故事]
        - [特殊武器故事, 特殊武器故事]
